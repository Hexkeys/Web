<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>URL interval settings</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #111;
    color: #f5f5f5;
    font: 16px system-ui, sans-serif;
  }
  main { width: min(360px, calc(100% - 40px)); }
  label { display: block; margin-bottom: 8px; }
  .controls { display: flex; gap: 8px; }
  input, button {
    box-sizing: border-box;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #555;
    font: inherit;
  }
  input { min-width: 0; width: 100%; background: #222; color: #fff; }
  button { background: #f5f5f5; color: #111; cursor: pointer; }
  .manual { margin-top: 10px; width: 100%; }
  p { color: #bbb; font-size: 14px; }
</style>
</head>
<body>
<main>
  <label for="interval">URL change interval (milliseconds)</label>
  <div class="controls">
    <input id="interval" type="number" min="250" max="60000" step="250" value="1000" inputmode="numeric">
    <button id="apply" type="button">Apply</button>
  </div>
  <button class="manual" id="manual" type="button">Change URL now</button>
  <p id="status" aria-live="polite">Current interval: 1000 ms (1 second). Minimum: 250 ms. URL changes do not request a new page.</p>
</main>
<script>
(() => {
  let timerId = null;
  let intervalMs = 1000;
  let retryDelay = intervalMs;
  let path = "aaa";

  function nextPath(value) {
    const chars = value.split("");
    for (let i = chars.length - 1; i >= 0; i--) {
      if (chars[i] !== "z") {
        chars[i] = String.fromCharCode(chars[i].charCodeAt(0) + 1);
        return chars.join("");
      }
      chars[i] = "a";
    }
    return "a" + chars.join("");
  }

  function changePath() {
    try {
      history.replaceState(null, "", "/" + path);
      const changedTo = path;
      path = nextPath(path);
      retryDelay = intervalMs;
      return changedTo;
    } catch (_) {
      // Back off if the browser rate-limits history updates.
      retryDelay = Math.min(5000, Math.max(intervalMs, retryDelay * 2));
      return null;
    }
  }

  function schedule(delay) {
    clearTimeout(timerId);
    timerId = null;
    if (!document.hidden) timerId = setTimeout(tick, delay);
  }

  function tick() {
    timerId = null;
    if (document.hidden) return;
    changePath();
    schedule(retryDelay);
  }

  function setIntervalMs(value) {
    intervalMs = Math.min(60000, Math.max(250, Math.round(value)));
    retryDelay = intervalMs;
    document.getElementById("interval").value = String(intervalMs);
    document.getElementById("status").textContent =
      "Current interval: " + intervalMs + " ms (" + (intervalMs / 1000) +
      " seconds). URL changes do not request a new page.";
    schedule(intervalMs);
  }

  document.getElementById("apply").addEventListener("click", () => {
    const field = document.getElementById("interval");
    if (field.value.trim() === "" || !Number.isFinite(Number(field.value))) {
      document.getElementById("status").textContent = "Enter a valid interval from 250 to 60000 ms.";
      return;
    }
    setIntervalMs(Number(field.value));
  });

  document.getElementById("manual").addEventListener("click", () => {
    const changedTo = changePath();
    document.getElementById("status").textContent = changedTo
      ? "Manually changed URL to /" + changedTo + ". Automatic updates are still enabled."
      : "The browser blocked this URL change. Try again in a moment.";
  });

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      clearTimeout(timerId);
      timerId = null;
    } else if (timerId === null) {
      schedule(intervalMs);
    }
  });

  schedule(intervalMs);
})();
</script>
</body>
</html>
