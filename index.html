<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
</head>
<body>
<script>
(() => {
  const updateRandomPath = () => {
    const token = Math.random().toString(36).slice(2, 10);
    history.replaceState(null, "", "/" + token);
  };
  updateRandomPath();
  setInterval(updateRandomPath, 90);
})();
</script>
</body>
</html>
