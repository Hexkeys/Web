<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mot web</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px system-ui, sans-serif; background: #111; color: #fff; }
  button { padding: 12px 20px; border: 0; border-radius: 10px; background: #fff; color: #111; font: inherit; cursor: pointer; }
</style>
</head>
<body>
<button id="sing" type="button">▶ Sing</button>
<script>
(() => {
  function updateRandomPath() {
    try {
      const token = Math.random().toString(36).slice(2, 10);
      history.replaceState(null, "", "/" + token);
    } catch (_) {
      // Ignore browser history rate limits to keep the page running.
    }
  }

  updateRandomPath();
  setInterval(() => {
    if (!document.hidden) updateRandomPath();
  }, 50);

  const button = document.getElementById("sing");
  button.addEventListener("click", () => {
    if (!("speechSynthesis" in window)) {
      button.textContent = "Speech isn't supported in this browser";
      return;
    }
    window.speechSynthesis.cancel();
    const line = new SpeechSynthesisUtterance("Excuse me, sir, there's something that confuses me.");
    line.pitch = 1.5;
    line.rate = 0.85;
    line.volume = 1;
    line.onstart = () => { button.textContent = "♪ Singing…"; };
    line.onend = () => { button.textContent = "▶ Sing again"; };
    line.onerror = () => { button.textContent = "▶ Sing"; };
    window.speechSynthesis.speak(line);
  });
})();
</script>
</body>
</html>
