<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>URL history settings</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #111;
    color: #f5f5f5;
    font: 16px system-ui, sans-serif;
  }
  main { width: min(360px, calc(100% - 40px)); }
  label { display: block; margin-bottom: 8px; }
  .controls { display: flex; gap: 8px; }
  input, button {
    box-sizing: border-box;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #555;
    font: inherit;
  }
  input { min-width: 0; width: 100%; background: #222; color: #fff; }
  button { background: #f5f5f5; color: #111; cursor: pointer; }
  .manual { margin-top: 10px; width: 100%; }
  p { color: #bbb; font-size: 14px; }
</style>
</head>
<body>
<main>
  <label for="interval">History entry interval (milliseconds)</label>
  <div class="controls">
    <input id="interval" type="number" min="25" max="60000" step="25" value="25" inputmode="numeric">
    <button id="apply" type="button">Apply</button>
  </div>
  <button class="manual" id="manual" type="button">Add history entry now</button>
  <p id="status" aria-live="polite">Current interval: 25 ms (0.025 seconds). Each entry gets a random value.</p>
</main>
<script>
(() => {
  let timerId = null;
  let intervalMs = 25;

  function randomValue() {
    return Math.random().toString(36).slice(2, 10);
  }

  function addHistoryEntry() {
    const entry = randomValue();
    try {
      const url = new URL(window.location.href);
      url.searchParams.set("p", entry);
      history.pushState({ value: entry }, "", url.pathname + url.search + url.hash);
      return entry;
    } catch (_) {
      // Keep automatic scheduling running if the browser rejects an entry.
      return null;
    }
  }

  function schedule(delay) {
    clearTimeout(timerId);
    timerId = null;
    if (!document.hidden) timerId = setTimeout(tick, delay);
  }

  function tick() {
    timerId = null;
    if (document.hidden) return;
    addHistoryEntry();
    schedule(intervalMs);
  }

  function setIntervalMs(value) {
    intervalMs = Math.min(60000, Math.max(25, Math.round(value)));
    document.getElementById("interval").value = String(intervalMs);
    document.getElementById("status").textContent =
      "Current interval: " + intervalMs + " ms (" + (intervalMs / 1000) +
      " seconds). Each entry gets a random value.";
    schedule(intervalMs);
  }

  document.getElementById("apply").addEventListener("click", () => {
    const field = document.getElementById("interval");
    if (field.value.trim() === "" || !Number.isFinite(Number(field.value))) {
      document.getElementById("status").textContent = "Enter a valid interval from 25 to 60000 ms.";
      return;
    }
    setIntervalMs(Number(field.value));
  });

  document.getElementById("manual").addEventListener("click", () => {
    const entry = addHistoryEntry();
    if (entry) {
      document.getElementById("status").textContent =
        "Added history entry with random value: " + entry;
    }
  });

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      clearTimeout(timerId);
      timerId = null;
    } else if (timerId === null) {
      schedule(intervalMs);
    }
  });

  schedule(intervalMs);
})();
</script>
</body>
</html>
