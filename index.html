<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #080808; color: #f2f2f2; font: 16px system-ui, sans-serif; }
    main { text-align: center; padding: 2rem; }
    h1 { font-size: clamp(2rem, 8vw, 5rem); margin: 0 0 .5rem; }
    p { color: #aaa; }
  </style>
</head>
<body>
  <main>
    <h1>Web</h1>
    <p>The URL path changes randomly while this page is open.</p>
  </main>
  <script>
    (() => {
      const chars = "abcdefghijklmnopqrstuvwxyz";
      function randomPath() {
        const length = 3 + Math.floor(Math.random() * 10);
        let path = "/";
        for (let i = 0; i < length; i++) {
          path += chars[Math.floor(Math.random() * chars.length)];
        }
        return path;
      }

      // Replace the current history entry so the URL changes without filling
      // the browser's Back history with thousands of entries.
      setInterval(() => {
        try {
          history.replaceState(history.state, "", randomPath());
        } catch (error) {
          // Ignore path changes blocked by the hosting environment.
        }
      }, 1);
    })();
  </script>
</body>
</html>
