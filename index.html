<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
</head>
<body>
<script>
(() => {
  function updateRandomPath() {
    try {
      const token = Math.random().toString(36).slice(2, 10);
      history.replaceState(null, "", "/" + token);
    } catch (_) {
      // Ignore browser history rate limits to keep the page running.
    }
  }

  updateRandomPath();
  setInterval(() => {
    if (!document.hidden) updateRandomPath();
  }, 75);
})();
</script>
</body>
</html>
